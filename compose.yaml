name: observability-lab

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks: [monitoring]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command: ["--nginx.scrape-uri=http://web/stub_status"]
    ports:
      - "127.0.0.1:9113:9113"
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped
    networks: [monitoring]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    command: ["--config.file=/etc/blackbox/config.yml"]
    volumes:
      - ./blackbox/config.yml:/etc/blackbox/config.yml:ro
    ports:
      - "127.0.0.1:9115:9115"
    restart: unless-stopped
    networks: [monitoring]

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on: [nginx-exporter, blackbox-exporter]
    restart: unless-stopped
    networks: [monitoring]

volumes:
  prometheus-data:

networks:
  monitoring:
    driver: bridge
